rootProject.name = "watchprogram"
include ':app'

Файл build.gradle (в корне):
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

Файл app/build.gradle (в папке app):
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.watchprogram.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.watchprogram.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}

2. Обнови файл main.yml (в папке .github/workflows/):
Замени весь текст в main.yml на этот. Я добавил команду для автоматической установки gradlew, если ты его забыл загрузить (теперь сервер сам создаст его!).

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Gradle Wrapper
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
